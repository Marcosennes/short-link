name: shortlink

x-kafka-image: &kafka-image apache/kafka:3.9.1

# link-service API, its migration job and the outbox relay share one image and config.
x-link-service: &link-service
  image: shortlink/link-service:dev
  build:
    context: .
    dockerfile: services/link-service/Dockerfile
  environment:
    LINK_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-shortlink}:${POSTGRES_PASSWORD:-shortlink}@postgres:5432/${POSTGRES_DB:-links}
    LINK_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    LINK_PUBLIC_BASE_URL: http://localhost:${GATEWAY_HOST_PORT:-8000}/r

services:
  gateway:
    image: traefik:v3.4
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
    ports:
      - "${GATEWAY_HOST_PORT:-8000}:80"
      - "${GATEWAY_DASHBOARD_HOST_PORT:-8081}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shortlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shortlink}
      POSTGRES_DB: ${POSTGRES_DB:-links}
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-shortlink}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-shortlink}
    ports:
      - "${MONGO_HOST_PORT:-27018}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: *kafka-image
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "${KAFKA_HOST_PORT:-29092}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10

  # One-shot job: creates the topics explicitly (auto-creation is disabled).
  kafka-init:
    image: *kafka-image
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for topic in link.events link.clicks; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
        done
    restart: "no"

  # ---------- application services ----------

  link-migrate:
    <<: *link-service
    command: ["python", "-m", "link_service.migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  link-service:
    <<: *link-service
    depends_on:
      link-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    labels:
      - traefik.enable=true
      - traefik.http.routers.links.rule=PathPrefix(`/api/links`)
      - traefik.http.routers.links.middlewares=strip-api
      - traefik.http.middlewares.strip-api.stripprefix.prefixes=/api
      - traefik.http.services.links.loadbalancer.server.port=8000
    restart: unless-stopped

  outbox-relay:
    <<: *link-service
    command: ["python", "-m", "link_service.relay"]
    depends_on:
      link-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------- inspection tools: docker compose --profile tools up -d ----------
  kafka-ui:
    image: kafbat/kafka-ui:v1.2.0
    profiles: [tools]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: shortlink
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "${KAFKA_UI_HOST_PORT:-8084}:8080"

  mongo-express:
    image: mongo-express:1.0.2
    profiles: [tools]
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER:-shortlink}:${MONGO_PASSWORD:-shortlink}@mongo:27017/
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "${MONGO_EXPRESS_HOST_PORT:-8083}:8081"

volumes:
  postgres-data:
  mongo-data:
  redis-data:
  kafka-data:
