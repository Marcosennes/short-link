[project]
name = "shortlink"
version = "0.1.0"
description = "URL shortener with click analytics — microservices study project"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["shortlink_contracts", "link_service", "redirect_service", "analytics_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib"
markers = ["integration: needs the Compose infrastructure (skipped when unavailable)"]

[tool.coverage.run]
# Migrations only run against a real database (covered by integration tests / Compose).
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true
